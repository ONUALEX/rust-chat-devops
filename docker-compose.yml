# Used locally (builds images) and on the Droplet (pulls images from GHCR).
services:
  # NOTE: the chat app does not use a database yet. This container is here so
  # the stack matches the assignment checklist.
  db:
    image: postgres:16-alpine
    container_name: chat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatpass}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat} -d ${POSTGRES_DB:-chat}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: ${IMAGE_PREFIX:-rust-chat}-backend:${TAG:-latest}
    container_name: chat_backend
    restart: unless-stopped
    expose:
      - "8000"          # internal only

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: ${IMAGE_PREFIX:-rust-chat}-frontend:${TAG:-latest}
    container_name: chat_frontend
    restart: unless-stopped
    expose:
      - "80"            # internal only

  nginx:
    image: nginx:1.27-alpine
    container_name: chat_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"         # the only public entry point
      # - "443:443"     # enable when you add HTTPS
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
